# P2 — CI/CD: her push'ta gofmt+vet+test+build, güvenlik taraması ve SBOM.
# Kurulum: .github/workflows/ci.yml olarak koyun.
name: aetheris-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: gofmt (biçim denetimi — sıfır tolerans)
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then echo "gofmt gerekli:"; echo "$fmt"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: test (race dedektörü + kapsam)
        run: go test -race -coverprofile=coverage.out ./...

      - name: build (temiz binary)
        run: go build -o gw ./cmd/gateway

      - name: govulncheck (bilinen CVE taraması)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true   # rapor amaçlı; kırmızıya çevirmek istersen "|| true" kaldır

      - name: SBOM (yazılım malzeme listesi — CycloneDX)
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod mod -json -output sbom.json ./... || cyclonedx-gomod app -json -output sbom.json ./cmd/gateway

      - name: SBOM'u artefakt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
