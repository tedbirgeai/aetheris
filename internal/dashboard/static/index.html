document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

.bg }};color:{{ iv.color }}\">{{ iv.status }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ invoicesEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"padding:14px;text-align:center;color:#8794b0;font-size:12px\">henüz fatura kesilmedi<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"text-align:center;color:#6b7280;font-size:11px;padding:26px 26px 30px;border-top:3px solid #1E1E8E\">\n    <div style=\"margin-bottom:10px\">tedbirge Gateway v1.0.0-enterprise · Zero-Knowledge WAL · tek binary · %100 off-grid · QNB Sanal POS · Ed25519 voucher · GİB e-Fatura<\u002Fdiv>\n    <div style=\"display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center\">\n      <button sc-camel-on-click=\"{{ openKvkk }}\" style=\"background:transparent;border:none;color:#1E1E8E;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;padding:0\" style-hover=\"opacity:.7\">KvKK Aydınlatma Metni<\u002Fbutton>\n      <span style=\"color:#c9c4ef\">·<\u002Fspan>\n      <button sc-camel-on-click=\"{{ openCookie }}\" style=\"background:transparent;border:none;color:#1E1E8E;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;padding:0\" style-hover=\"opacity:.7\">Çerez Politikası<\u002Fbutton>\n      <span style=\"color:#c9c4ef\">·<\u002Fspan>\n      <span>© 2026 Tedbirge Teknoloji A.Ş. — Tescilli marka<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <!-- KVKK / ÇEREZ MODAL -->\n  <sc-if value=\"{{ kvkkOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeKvkk }}\" style=\"position:fixed;inset:0;background:rgba(10,22,40,.5);backdrop-filter:blur(5px);display:flex;align-items:flex-start;justify-content:center;padding:52px 20px;z-index:60;overflow:auto;animation:aeOverlay .15s ease\">\n      <div sc-camel-on-click=\"{{ stop }}\" 002Fb> — kiracı oturum anahtarı. HttpOnly, SameSite=Strict. Oturum süresince.<\u002Fp>\n              <p style=\"margin:0 0 6px\"><b>tb_cookie_ack<\u002Fb> — çerez bildirimini onayladığınızı hatırlar (localStorage).<\u002Fp>\n              <p style=\"margin:12px 0 0\">Zorunlu çerezler hizmetin çalışması için gereklidir ve KVKK m.5/2-c/ç kapsamında açık rıza gerektirmez.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ÇEREZ ONAY BANDI -->\n  <sc-if value=\"{{ showCookieBanner }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:14px 20px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:2px solid #1E1E8E;box-shadow:0 -6px 24px rgba(30,30,142,.12)\">\n      <span style=\"font-size:12px;color:#454e6f;max-width:640px\">Yalnızca hizmetin çalışması için zorunlu çerezler kullanıyoruz. Detay için <button sc-camel-on-click=\"{{ openCookie }}\" style=\"background:transparent;border:none;color:#1E1E8E;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:0;text-decoration:underline\">Çerez Politikası<\u002Fbutton>.<\u002Fspan>\n      <button sc-camel-on-click=\"{{ ackCookie }}\" style=\"font-family:inherit;font-size:12px;font-weight:700;color:#fff;background:#1E1E8E;border:1px solid #1E1E8E;border-radius:8px;padding:9px 20px;cursor:pointer\" style-hover=\"background:#18187a\">Anladım<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- DEPLOY MODAL -->\n  <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeDeploy }}\" style=\"position:fixed;inset:0;background:rgba(10,22,40,.5);backdrop-filter:blur(5px);display:flex;align-items:flex-start;justify-content:center;padding:52px 20px;z-index:50;overflow:auto;animation:aeOverlay .15s ease\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:660px;background:#fff;border:1px solid #e7e7ef;border-radius:16px;box-shadow:0 24px 64px rgba(30,30,142,.28);overflow:hidden;animation:aeFade .18s ease\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:24px 26px;border-bottom:1px solid #e7e7ef;background:#f5f6fc\">\n          <div>\n            <div style=\"display:flex;align-items:center;gap:9px\">\n              <span style=\"width:9px;height:9px;border-radius:50%;background:#3b7f17;box-shadow:0 0 10px #3b7f17;animation:aeStream 1.6s ease-in-out infinite\"><\u002Fspan>\n              <h3 style=\"margin:0;font-size:16px;font-weight:700;letter-spacing:.3px\">Otonom Düğüm Config Paketi<\u002Fh3>\n            <\u002Fdiv>\n            <div style=\"color:#6b7280;font-size:11px;letter-spacing:.5px;margin-top:8px\">POST /admin/deploy · gerçek sunucu yanıtı<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeDeploy }}\" style=\"background:transparent;border:1px solid #e7e7ef;color:#454e6f;width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer;line-height:1\" style-hover=\"border-color:#d5d3ee;color:#1f2251\">×<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding:24px 26px;display:flex;flex-direction:column;gap:18px\">\n          <sc-if value=\"{{ deployLoading }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;align-items:center;gap:12px;color:#454e6f;font-size:13px;padding:20px 0\">\n              <span style=\"width:18px;height:18px;border:2px solid #e7e7ef;border-top-color:#1E1E8E;border-radius:50%;display:inline-block;animation:aeSpin .8s linear infinite\"><\u002Fspan>\n              sunucudan config paketi isteniyor…\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ deployErr }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:10px;align-items:flex-start;color:#dc2626;font-size:12px;line-height:1.5;background:#fee2e2;border:1px solid #fbcaca;border-radius:10px;padding:12px 15px\">\n              <span>✕<\u002Fspan><span>{{ deployErrMsg }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ deployReady }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:18px\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n              <div style=\"background:#f5f6fc;border:1px solid #e7e7ef;border-radius:10px;padding:13px 15px\">\n                <div style=\"color:#6b7280;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px\">Node ID<\u002Fdiv>\n                <div style=\"font-size:13px;color:#3b7f17;word-break:break-all\">{{ cfgNodeId }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#f5f6fc;border:1px solid #e7e7ef;border-radius:10px;padding:13px 15px\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:7px\">\n                  <span style=\"color:#6b7280;font-size:10px;letter-spacing:1px;text-transform:uppercase\">Relay Secret<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ toggleSecret }}\" style=\"background:transparent;border:none;color:#1E1E8E;font-family:inherit;font-size:10px;cursor:pointer;padding:0\" style-hover=\"opacity:.75\">{{ secretToggleLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"font-size:13px;color:#d97706;word-break:break-all\">{{ cfgRelayDisplay }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"color:#6b7280;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:9px\">Başlangıç Ortam Değişkenleri<\u002Fdiv>\n              <div style=\"background:#f5f6fc;border:1px solid #e7e7ef;border-radius:10px;overflow:hidden\">\n                <sc-for list=\"{{ envRows }}\" as=\"e\" hint-placeholder-count=\"7\">\n                  <div style=\"display:flex;justify-content:space-between;gap:14px;padding:9px 15px;border-bottom:1px solid #e7e7ef;font-size:12px\">\n                    <span style=\"color:#454e6f\">{{ e.k }}<\u002Fspan>\n                    <span style=\"color:#1f2251;text-align:right;word-break:break-all\">{{ e.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:flex-start;color:#454e6f;font-size:12px;line-height:1.5;background:#fef7e8;border:1px solid #fde3a7;border-radius:10px;padding:12px 15px\">\n              <span style=\"color:#d97706\">▸<\u002Fspan><span>{{ cfgNote }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ download }}\" style=\"display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:13px;font-weight:700;color:#fff;background:#1E1E8E;border:1px solid #1E1E8E;border-radius:8px;padding:11px 18px;cursor:pointer;transition:background .15s ease\" style-hover=\"background:#18187a\">\n                <span style=\"font-size:14px;line-height:1\">↧<\u002Fspan>{{ cfgFileName }} İndir\n              <\u002Fbutton>\n              <button sc-camel-on-click=\"{{ copyJson }}\" style=\"font-family:inherit;font-size:13px;font-weight:600;color:#1f2251;background:transparent;border:1px solid #d5d3ee;border-radius:8px;padding:11px 18px;cursor:pointer;transition:border-color .15s ease\" style-hover=\"border-color:#1E1E8E\">{{ copyLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ regen }}\" style=\"font-family:inherit;font-size:13px;font-weight:600;color:#454e6f;background:transparent;border:1px solid #d5d3ee;border-radius:8px;padding:11px 18px;cursor:pointer;transition:border-color .15s ease\" style-hover=\"border-color:#1E1E8E;color:#1f2251\">Yeniden Üret<\u002Fbutton>\n            <\u002Fdiv>\n            <details style=\"border-top:1px solid #e7e7ef;padding-top:14px\">\n              <summary style=\"cursor:pointer;color:#454e6f;font-size:12px;list-style:none\">› ham JSON yanıtı<\u002Fsummary>\n              <pre style=\"margin:12px 0 0;background:#f5f6fc;border:1px solid #e7e7ef;border-radius:10px;padding:15px;overflow:auto;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:#454e6f;line-height:1.6;max-height:260px\">{{ rawJson }}<\u002Fpre>\n            <\u002Fdetails>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:980},&quot;initialTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;tenant&quot;,&quot;billing&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Görünüm&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    tab: this.props.initialTab || \"admin\",\n    tele: null, connected: false,\n    modalOpen: false, showSecret: false, copied: false, cfg: null, deployLoading: false, deployErr: null,\n    edSupported: false,\n    coPlan: \"price_growth\", coClient: \"acme-robotics\", checkoutSession: null,\n    vBearer: \"acme-robotics:key\", vAmount: \"50\", lastVoucher: null, copiedV: false, vouchers: [], seen: {},\n    verifyMsg: \"\", verifyOk: false,\n    invUnvan: \"Acme Robotics A.Ş.\", invVkn: \"1234567890\", invEmail: \"billing@acme.io\", invMatrah: \"0\", invDiscount: \"0\",\n    invFmt: \"json\", invoiceDraft: null, invBelge: \"earsiv\", invMode: \"haric\", invKdvRate: \"20\", invoices: [], invSeq: 1, invErr: \"\", lastInvNo: \"\", sendStatus: \"\", sentEttn: \"\", copiedInv: false,\n    kvkkOpen: false, kvkkTab: \"kvkk\", cookieAck: false, canInstall: false\n  };\n\n  componentDidMount() {\n    this.bw = new Array(60).fill(0); this.connect(); this.detectEd(); this.draw(); this.loadInvoices();\n    try { if (localStorage.getItem(\"tb_cookie_ack\")) this.setState({ cookieAck: true }); } catch (e) {}\n    this._onBip = (ev) => { ev.preventDefault(); this._deferred = ev; this.setState({ canInstall: true }); };\n    window.addEventListener(\"beforeinstallprompt\", this._onBip);\n    window.addEventListener(\"appinstalled\", () => this.setState({ canInstall: false }));\n  }\n  componentDidUpdate() { if (this.state.tab === \"admin\") this.draw(); }\n  componentWillUnmount() { this._stop = true; clearTimeout(this._rc); if (this._ws) { try { this._ws.close(); } catch (e) {} } }\n\n  hex(b) { return Array.from(b).map(x => x.toString(16).padStart(2, \"0\")).join(\"\"); }\n  rnd(n) { const b = new Uint8Array(n); crypto.getRandomValues(b); return b; }\n  token() { try { return new URLSearchParams(location.search).get(\"token\") || \"\"; } catch (e) { return \"\"; } }\n  short(s, n) { s = String(s || \"\"); return s.length > n ? s.slice(0, n) + \"…\" : s; }\n\n  // ── live WebSocket telemetry ──\n  connect() {\n    if (this._stop) return;\n    try {\n      const proto = location.protocol === \"https:\" ? \"wss:\" : \"ws:\";\n      const ws = new WebSocket(proto + \"//\" + location.host + \"/api/v1/ws/telemetry?token=\" + encodeURIComponent(this.token()));\n      this._ws = ws;\n      ws.onopen = () => this.setState({ connected: true });\n      ws.onclose = () => { this.setState({ connected: false }); if (!this._stop) { clearTimeout(this._rc); this._rc = setTimeout(() => this.connect(), 2500); } };\n      ws.onerror = () => { try { ws.close(); } catch (e) {} };\n      ws.onmessage = (ev) => { try { const d = JSON.parse(ev.data); this.bw.push(d.throughput_bps || 0); this.bw.shift(); this.setState({ tele: d, connected: true }); } catch (e) {} };\n    } catch (e) { if (!this._stop) { clearTimeout(this._rc); this._rc = setTimeout(() => this.connect(), 2500); } }\n  }\n\n  go = (tab) => () => this.setState({ tab });\n  openKvkk = () => this.setState({ kvkkOpen: true, kvkkTab: \"kvkk\" });\n  openCookie = () => this.setState({ kvkkOpen: true, kvkkTab: \"cookie\" });\n  closeKvkk = () => this.setState({ kvkkOpen: false });\n  setKvkkKvkk = () => this.setState({ kvkkTab: \"kvkk\" });\n  setKvkkCookie = () => this.setState({ kvkkTab: \"cookie\" });\n  ackCookie = () => { try { localStorage.setItem(\"tb_cookie_ack\", \"1\"); } catch (e) {} this.setState({ cookieAck: true }); };\n  installApp = async () => { const e = this._deferred; if (!e) return; e.prompt(); try { await e.userChoice; } catch (x) {} this._deferred = null; this.setState({ canInstall: false }); };\n\n  // ── deploy ──\n  openDeploy = () => { this.setState({ modalOpen: true, showSecret: false, copied: false, cfg: null, deployErr: null, deployLoading: true }); this.fetchCfg(); };\n  fetchCfg() {\n    fetch(\"/admin/deploy?token=\" + encodeURIComponent(this.token()), { method: \"POST\" })\n      .then(r => { if (!r.ok) throw new Error(\"HTTP \" + r.status); return r.json(); })\n      .then(cfg => this.setState({ cfg, deployLoading: false, deployErr: null }))\n      .catch(e => this.setState({ deployLoading: false, deployErr: \"Sunucuya bağlanılamadı (\" + e.message + \"). Panel gateway binary'sine gömülüyken /admin/deploy gerçek paketi döndürür.\" }));\n  }\n  regen = () => { this.setState({ deployLoading: true, deployErr: null, cfg: null, showSecret: false, copied: false }); this.fetchCfg(); };\n  closeDeploy = () => this.setState({ modalOpen: false });\n  stop = (e) => e.stopPropagation();\n  toggleSecret = () => this.setState(s => ({ showSecret: !s.showSecret }));\n  download = () => { const b = new Blob([JSON.stringify(this.state.cfg, null, 2)], { type: \"application/json\" }); const u = URL.createObjectURL(b); const a = document.createElement(\"a\"); a.href = u; a.download = (this.state.cfg.node_id || \"aetheris-node\") + \"-config.json\"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); };\n  copyJson = () => this.copyText(JSON.stringify(this.state.cfg, null, 2), () => { this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1600); });\n  copyText(t, done) { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, done); else done(); }\n\n  // ── canvases ──\n  topoRef = (el) => { this._topo = el; if (el) this.draw(); };\n  sparkRef = (el) => { this._spark = el; if (el) this.draw(); };\n  draw() { this.drawTopo(); this.drawSpark(); }\n  drawTopo() {\n    const cv = this._topo; if (!cv || !cv.getContext) return;\n    const ctx = cv.getContext(\"2d\"), W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H);\n    const nodes = (this.state.tele && this.state.tele.nodes) || [];\n    if (!nodes.length) { ctx.fillStyle = \"#6b7280\"; ctx.font = \"13px ui-monospace,monospace\"; ctx.textAlign = \"center\"; ctx.fillText(\"mesh bekleniyor…\", W / 2, H / 2); return; }\n    const cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 46;\n    ctx.strokeStyle = \"rgba(30,30,142,.35)\"; ctx.lineWidth = 1.4;\n    for (let i = 1; i < nodes.length; i++) { const a = (i - 1) / Math.max(1, nodes.length - 1) * Math.PI * 2 - Math.PI / 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); ctx.stroke(); }\n    for (let j = 1; j < nodes.length; j++) { const ang = (j - 1) / Math.max(1, nodes.length - 1) * Math.PI * 2 - Math.PI / 2; this.dot(ctx, cx + Math.cos(ang) * R, cy + Math.sin(ang) * R, nodes[j], \"#1E1E8E\"); }\n    this.dot(ctx, cx, cy, nodes[0], \"#3b7f17\");\n  }\n  dot(ctx, x, y, n, color) {\n    ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fillStyle = n.alive === false ? \"#dc2626\" : color;\n    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0;\n    ctx.fillStyle = \"#454e6f\"; ctx.font = \"10px 'JetBrains Mono',monospace\"; ctx.textAlign = \"center\"; ctx.fillText(String(n.id || \"\").slice(0, 14), x, y - 12);\n  }\n  drawSpark() {\n    const cv = this._spark; if (!cv || !cv.getContext) return;\n    const ctx = cv.getContext(\"2d\"), W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H);\n    const hist = this.bw || new Array(60).fill(0); const peak = Math.max(1, ...hist), step = W / hist.length;\n    const grad = ctx.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, \"rgba(30,30,142,.22)\"); grad.addColorStop(1, \"rgba(30,30,142,.02)\");\n    ctx.beginPath(); ctx.moveTo(0, H); hist.forEach((v, i) => ctx.lineTo(i * step, H - (v / peak) * H * 0.85)); ctx.lineTo(W, H); ctx.closePath(); ctx.fillStyle = grad; ctx.fill();\n    ctx.beginPath(); ctx.strokeStyle = \"#1E1E8E\"; ctx.lineWidth = 2; hist.forEach((v, i) => { const px = i * step, py = H - (v / peak) * H * 0.85; i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }); ctx.stroke();\n    if (peak > 1) { ctx.fillStyle = \"#6b7280\"; ctx.font = \"10px ui-monospace,monospace\"; ctx.textAlign = \"right\"; ctx.fillText(this.fmtBytes(peak) + \"/s\", W - 6, 14); }\n  }\n\n  // ── stripe checkout ──\n  planDefs = [\n    { id: \"price_starter\", name: \"Starter\", gb: \"10 GB / ay\", amount: 10000, label: \"₺100\" },\n    { id: \"price_growth\", name: \"Growth\", gb: \"100 GB / ay\", amount: 75000, label: \"₺750\" },\n    { id: \"price_scale\", name: \"Scale\", gb: \"1 TB / ay\", amount: 450000, label: \"₺4.500\" },\n    { id: \"price_enterprise\", name: \"Enterprise\", gb: \"Özel kota\", amount: 0, label: \"Görüşme\" }\n  ];\n  selectPlan = (id) => () => this.setState({ coPlan: id });\n  setCoClient = (e) => this.setState({ coClient: e.target.value });\n  createCheckout = () => {\n    const p = this.planDefs.find(x => x.id === this.state.coPlan) || this.planDefs[0];\n    if (!p.amount) { this.setState({ checkoutSession: { enterprise: true, id: \"\", url: \"mailto:satis@tedbirge.
