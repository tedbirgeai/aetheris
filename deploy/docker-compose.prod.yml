# AETHERIS — Uretim Docker mimarisi
#
# Kullanim:
#   cp deploy/aetheris.env.example .env   # degerleri doldurun
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# Notlar:
#   - Sirlar .env dosyasindan gelir; imaj icine GOMULMEZ.
#   - WAL kalici bir hacimde tutulur (aetheris_wal); kayit kaybi olmaz.
#   - Ham ICMP QoS probu icin gateway'e CAP_NET_RAW verilir.

name: aetheris-prod

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    image: aetheris/gateway:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AETHERIS_LISTEN: ":8080"
      AETHERIS_DATABASE_DSN: "postgres://aetheris:${POSTGRES_PASSWORD:-aetheris}@postgres:5432/aetheris?sslmode=disable"
      AETHERIS_REDIS_ADDR: "redis:6379"
      AETHERIS_WAL_ENABLED: "true"
      AETHERIS_WAL_DIR: "/var/lib/aetheris/wal"
      AETHERIS_API_KEYS: "${AETHERIS_API_KEYS}"
      AETHERIS_METRICS: "true"
      AETHERIS_METRICS_TOKEN: "${AETHERIS_METRICS_TOKEN}"
      AETHERIS_ADMIN: "true"
      AETHERIS_ADMIN_TOKEN: "${AETHERIS_ADMIN_TOKEN}"
    ports:
      - "8080:8080"
    volumes:
      - aetheris_wal:/var/lib/aetheris/wal
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aetheris
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-aetheris}"
      POSTGRES_DB: aetheris
    volumes:
      - aetheris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetheris -d aetheris"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - aetheris_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  aetheris_wal:
  aetheris_pgdata:
  aetheris_redis:
